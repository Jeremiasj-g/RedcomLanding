name: PR quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: ESLint
        run: npm run lint

  review-checklist:
    name: AGENTS review checklist
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed PR checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-review.mjs

# Next.js se compila con Vercel. Evitar builds duplicados en GitHub Actions.
# Las verificaciones visuales del checklist necesitan una prueba en navegador.
