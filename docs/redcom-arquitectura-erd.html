.top{grid-column:1/4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px;background:#10141a}
.brand{font-size:15px;font-weight:600;letter-spacing:-.4px;white-space:nowrap}.brand em{font-style:normal;color:var(--amber)}
.stats{display:flex;align-items:center;gap:19px;margin-left:auto}.stat{display:grid;gap:3px;white-space:nowrap}.stat strong{font-size:16px;font-weight:600}.stat small{color:var(--muted);font-size:10px}
.readonly{font-size:11px;color:#91dbc1;background:#153429;border:1px solid #27604b;border-radius:999px;padding:7px 10px;white-space:nowrap}
.ghost{border:1px solid var(--line);background:var(--p2);padding:9px 12px;border-radius:10px;transition:.2s;white-space:nowrap}.ghost:hover{background:#242d39;border-color:#46515f}.ghost.active{border-color:#d69a5d;color:#ffc98f;background:#32251c}
.nav{grid-row:2;grid-column:1;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
.search{width:100%;height:40px;background:#0d1117;border:1px solid #303844;border-radius:11px;padding:0 12px;outline:none}
.search:focus{border-color:var(--amber)}.small-label{font-size:10px;letter-spacing:1.2px;color:#788598;text-transform:uppercase;margin:22px 10px 10px}
.mod{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#aab4c1;text-align:left;transition:.2s}
.mod:hover,.mod.on{background:#242b35;color:#fff}.mod.on{box-shadow:inset 2px 0 var(--amber)}.mod .count{color:#677587;font-size:11px}
.nav-table{width:100%;display:block;text-align:left;background:none;border:0;padding:7px 11px 7px 24px;color:#8e9baa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px}
.nav-table:hover,.nav-table.on{color:#ffbf77;background:#25201c}
.center{grid-column:2;grid-row:2;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.toolbar{height:auto;min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#10151b}
.segment{display:flex;gap:4px;background:#1b212a;padding:4px;border-radius:11px}.segment button{background:transparent;border:0;border-radius:8px;padding:8px 13px;color:#98a4b3}.segment button.on{background:#313944;color:#fff}
.subtitle{color:var(--muted);font-size:11px}.spacer{flex:1}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;background-image:radial-gradient(#202935 1px,transparent 1px);background-size:25px 25px;touch-action:none}
.canvas:active{cursor:grabbing}.scene{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.wire{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{stroke:#394858;stroke-width:1.6;fill:none;opacity:.65;transition:opacity .2s,stroke .2s,stroke-width .2s}
.edge.view{stroke-dasharray:5 6;stroke:#6e7e9c}.edge.active{stroke:#ffbe78;stroke-width:2.8;opacity:1;filter:drop-shadow(0 0 5px #ffad6caa)}.edge.dim{opacity:.09}
.node{position:absolute;width:218px;min-height:122px;background:#171d26;border:1px solid #394350;border-radius:13px;padding:12px;cursor:pointer;transition:border-color .2s,box-shadow .2s,filter .2s,opacity .2s;color:#dce5ef}
.node:hover{border-color:#8090a4;filter:brightness(1.15)}.node.selected{border-color:#ffb564;box-shadow:0 0 0 2px #ec9b4c90,0 0 25px #ff8c32aa,0 0 58px #ff872b55;filter:brightness(1.23);z-index:3}

.node.dim{opacity:.35;filter:saturate(.5)}.node .n-title{font-weight:600;font-size:12px;word-break:break-word}.node .n-module{font-size:10px;margin:5px 0 9px;color:var(--module)}

<script>
'use strict';
const META=JSON.parse(document.getElementById('schema-data').textContent);
const entities=META.entities.map(e=>Object.assign(e,{id:e.s+'.'+e.n})),byId=new Map(entities.map(e=>[e.id,e]));
const fks=META.edges.filter(e=>byId.has(e.f)&&byId.has(e.t));const viewdeps=META.viewdeps.filter(e=>byId.has(e.f)&&byId.has(e.t));
const moduleColors=['#fbad72','#72c7a8','#8ba8ff','#e2acff','#eac476','#7dc5e4','#f18f97','#a9c17e','#c89df3','#9cafbd','#f1ae79','#69b8c7'];
const moduleNames=[...new Set(entities.map(e=>e.m))].sort((a,b)=>a.localeCompare(b,'es'));
const colors=new Map(moduleNames.map((m,i)=>[m,moduleColors[i%moduleColors.length]]));
let module='Categorías y SIGO',mode='map',search='',selected=null,focus=true,relatedOnly=false,zoom=1,tx=0,ty=0,w=1000,h=750;
let visible=[],positions=new Map(),connected=new Set(),activePointers=new Map(),lastPinch=0,drag=null;
const $=id=>document.getElementById(id),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const color=e=>colors.get(e.m)||'#90a5bc';
const fields=e=>e.c.map(c=>c[0]);
function conn(id){const result=new Set();for(const e of fks.concat(viewdeps)){if(e.f===id)result.add(e.t);if(e.t===id)result.add(e.f)}return result}
function filterEntities(){
 connected=selected?conn(selected):new Set();
 return entities.filter(e=>(module==='Todos'||e.m===module)&&(!search||clean(e.id+' '+fields(e).join(' ')).includes(clean(search)))&&(!relatedOnly||!selected||e.id===selected||connected.has(e.id)));
}
function fmtCount(){const tables=entities.filter(e=>e.k==='r'||e.k==='p'),views=entities.filter(e=>e.k==='v'||e.k==='m');$('totalTables').textContent=tables.length;$('totalViews').textContent=views.length;$('totalFks').textContent=fks.length;$('totalCols').textContent=entities.reduce((n,e)=>n+e.c.length,0).toLocaleString('es-AR');$('dateLabel').textContent='Extracción: '+META.extracted_at;}
function renderNav(){
 const counts=new Map(moduleNames.map(m=>[m,entities.filter(e=>e.m===m).length]));
 $('moduleList').innerHTML=['Todos',...moduleNames].map(m=>'<button class="mod '+(module===m?'on':'')+'" data-module="'+esc(m)+'"><span>'+esc(m)+'</span><span class="count">'+(m==='Todos'?entities.length:counts.get(m))+'</span></button>').join('');
 $('navTables').innerHTML=visible.map(e=>'<button class="nav-table '+(e.id===selected?'on':'')+'" data-pick="'+esc(e.id)+'" title="'+esc(e.id)+'">'+esc(e.n)+(e.k==='v'||e.k==='m'?' ◇':'')+'</button>').join('')||'<div class="empty">Sin resultados</div>';
 document.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>{module=b.dataset.module;render(true);$('nav').classList.remove('open')}));
 document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
}
function layout(){
 positions=new Map();const groups=new Map();
 for(const e of visible){if(!groups.has(e.m))groups.set(e.m,[]);groups.get(e.m).push(e)}
 let y=55;const perRow=module==='Todos'?4:3;
 for(const [name,arr] of groups){
  for(let i=0;i<arr.length;i++){let col=i%perRow,row=Math.floor(i/perRow);positions.set(arr[i].id,{x:45+col*255,y:y+row*163})}
  y+=Math.ceil(arr.length/perRow)*163+74;
 }
 w=perRow*255+100;h=Math.max(400,y+20);
}
function nodeClass(id){if(!selected)return '';return id===selected?'selected':connected.has(id)?'related':'dim'}
function drawMap(){
 $('scene').style.width=w+'px';$('scene').style.height=h+'px';$('wire').setAttribute('width',w);$('wire').setAttribute('height',h);$('wire').style.width=w+'px';$('wire').style.height=h+'px';
 $('nodes').innerHTML=visible.map(e=>{const p=positions.get(e.id);let mini=e.c.slice(0,4).map(c=>'<div class="f"><span class="key '+(c[3]?'pk':c[4]?'fk':'')+'">'+(c[3]?'PK':c[4]?'FK':'·')+'</span><span>'+esc(c[0])+'</span></div>').join('');
 return '<button type="button" class="node '+nodeClass(e.id)+'" data-node="'+esc(e.id)+'" style="left:'+p.x+'px;top:'+p.y+'px;--module:'+color(e)+'"><div class="n-title">'+esc(e.n)+'</div><div class="n-module">'+esc(e.m)+'</div><div class="n-fields">'+mini+(e.c.length>4?'<div class="f">+'+(e.c.length-4)+' campos</div>':'')+'</div></button>'}).join('');
 const edges=fks.map(e=>Object.assign({view:false},e)).concat(viewdeps.map(e=>Object.assign({view:true},e)));
 $('lines').innerHTML=edges.filter(e=>positions.has(e.f)&&positions.has(e.t)).map(e=>{
  const a=positions.get(e.f),b=positions.get(e.t),x=a.x+218,y=a.y+58,X=b.x,Y=b.y+58;
  const p='M'+x+' '+y+' C'+(x+Math.max(45,Math.abs(X-x)/2))+' '+y+' '+(X-Math.max(45,Math.abs(X-x)/2))+' '+Y+' '+X+' '+Y;
  const isHot=selected&&(e.f===selected||e.t===selected);
  const dim=selected&&!isHot;
  if(focus&&selected&&!isHot)return '';
  return '<path class="edge '+(e.view?'view ':'')+(isHot?'active ':dim?'dim':'')+'" d="'+p+'" marker-end="url(#'+(isHot?'arrowActive':'arrow')+')"><title>'+esc(e.f+' → '+e.t+(e.n?' ['+e.n+']':''))+'</title></path>';
 }).join('');
 document.querySelectorAll('[data-node]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();pick(b.dataset.node)}));
 applyTransform();
}
function renderInventory(){
 const groups=new Map();for(const e of visible){if(!groups.has(e.m))groups.set(e.m,[]);groups.get(e.m).push(e)}
 $('inventory').innerHTML=[...groups].map(([m,arr])=>'<h3 class="grouphead"><span style="color:'+colors.get(m)+'">●</span>'+esc(m)+' <span class="badge">'+arr.length+'</span></h3><div class="gridcards">'+arr.map(e=>
 '<button class="inv '+nodeClass(e.id)+'" style="--module:'+color(e)+'" data-inv="'+esc(e.id)+'"><strong>'+esc(e.n)+'</strong><small>'+esc(e.c.slice(0,5).map(c=>c[0]).join(' · '))+'</small><div class="accent">'+e.c.length+' columnas · '+fks.filter(k=>k.f===e.id||k.t===e.id).length+' relaciones · '+(e.k==='v'||e.k==='m'?'Vista':'Tabla')+'</div></button>').join('')+'</div>').join('')||'<div class="empty">No se encontraron tablas.</div>';
 document.querySelectorAll('[data-inv]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.inv)));
}
function relatedButtons(id,kind){const list=fks.filter(e=>kind==='out'?e.f===id:e.t===id);return list.map(e=>{const target=kind==='out'?e.t:e.f;return '<button class="relbtn" data-jump="'+esc(target)+'">'+esc(target)+'<small>'+esc(e.fc.join(', ')+' → '+e.tc.join(', '))+' · '+esc(e.n)+'</small></button>'}).join('')||'<div class="dimtext">Ninguna relación FK declarada</div>'}
function inspect(){
 const e=byId.get(selected);
 if(!e){$('inspectContent').innerHTML='<div class="empty">Seleccioná una tabla para inspeccionar sus columnas y relaciones.</div>';return}
 const pk=e.c.filter(c=>c[3]).map(c=>c[0]);
 const otherView=viewdeps.filter(d=>d.f===e.id);
 $('inspectContent').innerHTML='<div class="dimtext" style="color:'+color(e)+'">'+esc(e.m)+'</div><div class="heading" style="margin-top:8px">'+esc(e.id)+'</div><p class="dimtext">'+(e.k==='v'||e.k==='m'?'Vista de PostgreSQL.':'Tabla física de PostgreSQL.')+' La agrupación por módulo se basa en su nombre y es orientativa.</p>'+
 '<span class="pill">'+e.c.length+' columnas</span><span class="pill">'+(e.k==='v'||e.k==='m'?'Vista':'Tabla')+'</span><span class="pill">RLS: '+(e.k==='v'||e.k==='m'?'No aplica':e.r?'Activo':'No activo')+'</span>'+
 '<div class="sectiontitle">Claves primarias</div>'+(pk.length?pk.map(x=>'<span class="pill">'+esc(x)+'</span>').join(''):'<div class="dimtext">Sin PK declarada</div>')+
 '<div class="sectiontitle">Columnas</div>'+e.c.map(c=>'<div class="colrow"><div class="colname">'+esc(c[0])+(c[3]?'<span class="key pk">PK</span>':'')+(c[4]?'<span class="key fk">FK</span>':'')+'<div style="font-size:10px;color:#77879a;margin-top:4px">'+(c[2]?'Obligatorio':'Opcional')+'</div></div><span class="coltype">'+esc(c[1])+'</span></div>').join('')+
 '<div class="sectiontitle">Relaciones salientes</div>'+relatedButtons(e.id,'out')+
 '<div class="sectiontitle">Relaciones entrantes</div>'+relatedButtons(e.id,'in')+
 (otherView.length?'<div class="sectiontitle">Dependencias de vista</div>'+otherView.map(d=>'<button class="relbtn" data-jump="'+esc(d.t)+'">'+esc(d.t)+'<small>Dependencia informativa, no FK</small></button>').join(''):'')+
 '<div class="sectiontitle">Políticas RLS ('+e.p.length+')</div>'+(e.p.length?e.p.map(p=>'<div class="colrow"><span>'+esc(p[0])+'</span><span class="coltype">'+esc(p[1])+'</span></div>').join(''):'<div class="dimtext">No hay políticas registradas para este objeto</div>');
 document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.jump)));
}
function pick(id){
 if(!byId.has(id))return;
 if(!visible.some(e=>e.id===id)){module='Todos';search='';$('search').value='';relatedOnly=false;}
 selected=id;render(false);
 if(mode==='map')centerOn(id);
 if(innerWidth<=1200)$('inspector').classList.add('open');
}
function render(shouldFit=false){
 visible=filterEntities();renderNav();layout();inspect();$('shownCount').textContent=visible.length+' objetos visibles';
 if(mode==='map'){drawMap();if(shouldFit)fit()}else renderInventory();
}
function applyTransform(){$('scene').style.transform='translate('+tx+'px,'+ty+'px) scale('+zoom+')';$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function fit(){const rect=$('canvas').getBoundingClientRect();zoom=Math.min(1.08,Math.max(.09,Math.min((rect.width-80)/w,(rect.height-65)/h)));tx=(rect.width-w*zoom)/2;ty=(rect.height-h*zoom)/2;applyTransform()}
function centerOn(id){const p=positions.get(id);if(!p)return;const rect=$('canvas').getBoundingClientRect();zoom=Math.max(.65,Math.min(1.15,zoom));tx=rect.width/2-(p.x+109)*zoom;ty=rect.height/2-(p.y+65)*zoom;applyTransform()}
function setZoom(scale,ox,oy){const z=Math.min(2.6,Math.max(.1,scale));tx=ox-(ox-tx)*z/zoom;ty=oy-(oy-ty)*z/zoom;zoom=z;applyTransform()}
$('search').addEventListener('input',e=>{search=e.target.value;render(true)});
$('modeMap').onclick=()=>{mode='map';$('canvas').hidden=false;$('inventory').hidden=true;$('modeMap').classList.add('on');$('modeInventory').classList.remove('on');render(true)};
$('modeInventory').onclick=()=>{mode='inventory';$('canvas').hidden=true;$('inventory').hidden=false;$('modeInventory').classList.add('on');$('modeMap').classList.remove('on');render(false)};
$('focusBtn').onclick=()=>{focus=!focus;$('focusBtn').textContent='Conexiones: '+(focus?'foco':'todas');if(mode==='map')drawMap()};
$('relatedBtn').onclick=()=>{relatedOnly=!relatedOnly;$('relatedBtn').textContent='Solo relacionadas: '+(relatedOnly?'sí':'no');render(true)};
$('zoomIn').onclick=()=>setZoom(zoom*1.2,$('canvas').clientWidth/2,$('canvas').clientHeight/2);
$('zoomOut').onclick=()=>setZoom(zoom/1.2,$('canvas').clientWidth/2,$('canvas').clientHeight/2);
$('fitBtn').onclick=fit;
$('canvas').addEventListener('wheel',e=>{e.preventDefault();const r=$('canvas').getBoundingClientRect();setZoom(zoom*(e.deltaY>0?.89:1.12),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('canvas').addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;$('canvas').setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,tx,ty};lastPinch=0});
$('canvas').addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){const a=[...activePointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)setZoom(zoom*dist/lastPinch,(a[0].x+a[1].x)/2-$('canvas').getBoundingClientRect().left,(a[0].y+a[1].y)/2-$('canvas').getBoundingClientRect().top);lastPinch=dist;return}if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyTransform()}});
const endPointer=e=>{activePointers.delete(e.pointerId);drag=null;lastPinch=0};$('canvas').addEventListener('pointerup',endPointer);$('canvas').addEventListener('pointercancel',endPointer);
$('menuBtn').onclick=()=>$('nav').classList.toggle('open');$('inspectBtn').onclick=()=>$('inspector').classList.toggle('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('nav').classList.remove('open');$('inspector').classList.remove('open')}});
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(META,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='redcom_arquitectura_schema.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)};
fmtCount();render(true);window.addEventListener('resize',()=>{if(mode==='map')fit()});
</script></body></html>
